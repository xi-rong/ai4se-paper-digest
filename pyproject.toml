[project]
name = "ai4se-paper-digest"
version = "0.1.0"
description = "Evidence-based personal AI4SE research digest, cloud-ready"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paper-digest = "paper_digest.cli:main"

[tool.setuptools.packages.find]
include = ["paper_digest*"]
